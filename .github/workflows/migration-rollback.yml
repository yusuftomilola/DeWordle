name: Migration Rollback

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/src/migrations/**"
      - "backend/package-lock.json"
      - ".github/workflows/migration-rollback.yml"
  push:
    branches: [main]
    paths:
      - "backend/src/migrations/**"

jobs:
  migration-rollback:
    name: Migration up/down against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dewordle_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migration rollback tests
        run: npx jest src/migrations/migration-rollback.spec.ts
        working-directory: backend
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://test:test@localhost:5432/dewordle_migration_test
          MIGRATION_TIMINGS_FILE: ${{ runner.temp }}/migration-timings.json

      - name: Upload migration timings
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-timings
          path: ${{ runner.temp }}/migration-timings.json
          retention-days: 14
