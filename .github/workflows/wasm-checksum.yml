# .github/workflows/wasm-checksum.yml
name: WASM Checksum Verifier

# Reproducible-build guard for the Soroban contracts.
#
# The workflow rebuilds every contract with a pinned Rust toolchain and
# publishes SHA-256 checksums together with the exact build environment, so a
# local rebuild can be verified against the binary that CI produced.

on:
  push:
    paths:
      - 'soroban/contracts/**'
      - 'soroban/crates/**'
      - 'soroban/Cargo.toml'
      - 'soroban/Cargo.lock'
      - '.github/workflows/wasm-checksum.yml'
  pull_request:
    paths:
      - 'soroban/contracts/**'
      - 'soroban/crates/**'
      - 'soroban/Cargo.toml'
      - 'soroban/Cargo.lock'
      - '.github/workflows/wasm-checksum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wasm:
    name: Build and checksum contract WASM
    runs-on: ubuntu-latest
    env:
      # Pinned for reproducibility. Keep in sync with docs/.toolchain-versions.
      RUST_VERSION: "1.88"
      WASM_DIR: soroban/target/wasm32-unknown-unknown/release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Record build environment
        run: |
          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "rust_target=wasm32-unknown-unknown"
            echo "soroban_sdk=$(cd soroban && cargo tree -p core_game --depth 1 2>/dev/null | grep -m1 'soroban-sdk ' || echo unknown)"
          } | tee soroban/wasm-build-env.txt
          cat soroban/wasm-build-env.txt

      - name: Build contract WASM
        working-directory: soroban
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Compute checksums
        run: |
          if [ ! -d "$WASM_DIR" ]; then
            echo "WASM output directory not found: $WASM_DIR" >&2
            exit 1
          fi
          find "$WASM_DIR" -maxdepth 1 -name '*.wasm' -print0 \
            | sort -z \
            | xargs -0 sha256sum | tee wasm-checksums.txt
          echo "---"
          cat wasm-checksums.txt

      - name: Upload checksum artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-checksums
          path: |
            wasm-checksums.txt
            soroban/wasm-build-env.txt
